<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guau&Miau - Registro</title>
  <link rel="stylesheet" href="css/registro.css">
</head>
<body>
  <main class="registro-card">
    <h2>Registro de Usuario</h2>
    
    <form id="form-registro" novalidate>
      <div class="form-group">
        <label for="nombre">Nombre Completo *</label>
        <input type="text" id="nombre" maxlength="50">
        <span class="error-msg" id="error-nombre"></span>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico (@duoc.cl) *</label>
        <input type="email" id="email">
        <span class="error-msg" id="error-email"></span>
      </div>

      <div class="form-group">
        <label for="password">Contraseña *</label>
        <input type="password" id="password">
        <span class="error-msg" id="error-password"></span>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirmar Contraseña *</label>
        <input type="password" id="confirm-password">
        <span class="error-msg" id="error-confirm-password"></span>
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono (Opcional)</label>
        <input type="tel" id="telefono">
        <span class="error-msg" id="error-telefono"></span>
      </div>

      <!-- Contenedor listo para el modulo de Mascotas (Integrante 2) -->
      <div id="seccion-mascotas"></div>

      <button type="submit" id="btn-submit">Crear Cuenta</button>
    </form>
  </main>

  <script src="js/registro.js"></script>
</body>
</html>
